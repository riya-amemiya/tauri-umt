[package]
authors = ["you"]
description = "A Tauri App"
edition = "2021"
name = "tauri-umt"
version = "0.1.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "tauri_umt_lib"

[build-dependencies]
tauri-build = {version = "2.0.2", features = []}

[dependencies]
llvm-sys = "191.0.0"
serde = {version = "1.0.214", features = ["derive"]}
serde_json = "1.0.132"
tauri = {version = "2.0.6", features = []}
tauri-plugin-shell = "2.0.2"
